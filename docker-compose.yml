services:
  relay:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${RELAY_PORT:-2222}:2222"
    environment:
      RELAY_HOST: ${RELAY_HOST:?set RELAY_HOST to the relay address domain}
      SSH_HOST_KEY_FILE: ${SSH_HOST_KEY_FILE:-}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-26214400}
      MAX_MESSAGE_BYTES: ${MAX_MESSAGE_BYTES:-52428800}
      QUOTA_BYTES: ${QUOTA_BYTES:-1073741824}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-120}
    volumes:
      - relay-data:/data
      - type: bind
        source: ${SSH_CONFIG_DIR:-./ssh-config}
        target: /config
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  relay-data:
