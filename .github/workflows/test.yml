name: Test
on:
  push:
    branches: ['**']
    tags-ignore: ['v*'] # Release calls this workflow for these tags.
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.27.4'
          cache: ${{ github.ref_type != 'tag' }}
      - run: go test ./...
      - run: go build ./cmd/spool-relay
