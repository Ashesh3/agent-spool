name: Release relay and agent guide
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Test and cross-compile the relay
        env:
          CGO_ENABLED: '0'
        run: |
          set -eu
          go test ./...
          mkdir dist
          for os in darwin linux windows; do
            ext=''; if [ "$os" = windows ]; then ext='.exe'; fi
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "dist/spool-relay-$os-$arch$ext" ./cmd/spool-relay
            done
          done
          cp AGENT_SSH.md dist/
          (cd dist && sha256sum spool-relay-* AGENT_SSH.md > SHA256SUMS)
      - name: Publish relay binaries, agent guide and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
